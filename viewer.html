<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajnish Prime - Content Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .content-box { display: none; margin-top: 20px; text-align: left; }
        .resource-item { background: #1f2937; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .resource-item a { color: #4ade80; text-decoration: none; font-weight: bold; font-size: 14px; }
        .resource-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <h1>Rajnish Prime Access</h1>
        <p>Enter your approved mobile number to unlock content</p>
        
        <form id="verifyForm">
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="verifyMobile" placeholder="Enter your registered mobile" required>
            </div>
            <button type="submit" id="verifyBtn">Access Content</button>
        </form>

        <div class="content-box" id="contentArea">
            <h3 style="color: #4ade80; margin-bottom: 15px; text-align: center;">🎉 Access Granted!</h3>
            <div class="resource-item">
                <span>Physics Wallah Batch Notes</span>
                <a href="https://t.me/+g0wmAK8VCGEwMTJl" target="_blank">Open</a>
            </div>
            <div class="resource-item">
                <span>Target Board Study Material</span>
                <a href="https://t.me/+g0wmAK8VCGEwMTJl" target="_blank">Open</a>
            </div>
            <div class="resource-item">
                <span>Exclusive Video Lectures</span>
                <a href="https://t.me/+g0wmAK8VCGEwMTJl" target="_blank">Open</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYvsjbOgtXqdQx4bjiILDMa8d52MzaF1",
            authDomain: "rajnishprime-38165.firebaseapp.com",
            projectId: "rajnishprime-38165",
            storageBucket: "rajnishprime-38165.appspot.com",
            messagingSenderId: "411710609786",
            appId: "1:411710609786:web:9f483a511b5d121b25ec3",
            measurementId: "G-D501HHZJF0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const verifyForm = document.getElementById('verifyForm');
        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('verifyMobile').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');

            verifyBtn.disabled = true;
            verifyBtn.innerText = "Checking...";

            try {
                const q = query(collection(db, "approvedUsers"), where("mobileNumber", "==", mobile));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    document.getElementById('verifyForm').style.display = 'none';
                    document.getElementById('contentArea').style.display = 'block';
                } else {
                    alert("❌ Access Denied: Your payment is either pending verification or mobile number is not approved yet.");
                }
            } catch (error) {
                console.error("Error verifying user: ", error);
                alert("Error connecting to database. Try again.");
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerText = "Access Content";
            }
        });
    </script>
</body>
</html>
