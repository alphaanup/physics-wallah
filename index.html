<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajnish Prime - Premium Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; }
        .price-box { font-size: 28px; font-weight: bold; color: #4ade80; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .secondary-btn { background: linear-gradient(135deg, #22c55e, #16a34a); margin-top: 15px; }
        .content-box { display: none; margin-top: 20px; text-align: left; }
        
        .platform-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #38bdf8; border-radius: 12px; padding: 15px; text-align: center; margin-top: 10px; }
        .platform-card h2 { color: #38bdf8; font-size: 18px; margin-bottom: 6px; }
        .platform-card p { color: #9ca3af; font-size: 12px; margin-bottom: 12px; }
        .platform-btn { display: inline-block; width: 100%; padding: 10px; background: #38bdf8; color: #0b0f19; font-weight: bold; text-decoration: none; border-radius: 6px; font-size: 14px; transition: 0.3s; }
        .platform-btn:hover { background: #0ea5e9; color: #fff; }

        #secureViewer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            z-index: 9999;
            flex-direction: column;
        }
        .viewer-header {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .viewer-header h2 { color: #38bdf8; font-size: 16px; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .close-btn:hover { background: #dc2626; }
        .secure-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="formSection">
            <h1>Membership Fee:</h1>
            <div class="price-box">199</div>
            <p>Scan & Pay 199 using any UPI App</p>
            
            <div style="background: #fff; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 20px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=9661734021@ibl&pn=RajnishKumar&am=199&cu=INR" alt="UPI QR Code" style="width: 160px; height: 160px; display: block;">
            </div>

            <div style="background: #1f2937; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #9ca3af;">
                Access Code: <span style="color: #38bdf8; font-weight: bold;">Prime@2026</span><br>
                UPI ID: <span style="color: #4ade80; font-weight: bold;">9661734021@ibl</span>
            </div>

            <form id="paymentForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="mobileNumber" placeholder="Enter your mobile number" required>
                </div>
                <button type="submit" id="submitBtn">Submit Details</button>
            </form>

            <button type="button" class="secondary-btn" onclick="showStatusCheck()">Already Paid? Check Status / View Content</button>
        </div>

        <!-- Status Check & Content View Section -->
        <div id="statusSection" style="display: none;">
            <h1 style="color: #4ade80;">Check Approval</h1>
            <p>Enter your mobile number to view content</p>
            <div class="form-group">
                <label>Registered Mobile *</label>
                <input type="tel" id="verifyMobile" placeholder="Enter your mobile number">
            </div>
            <button type="button" id="verifyBtn" onclick="checkApproval()">Access Content</button>
            <button type="button" style="background: #374151; margin-top: 10px;" onclick="backToForm()">Back to Payment</button>

            <div class="content-box" id="contentArea">
                <h3 style="color: #4ade80; margin-bottom: 10px; text-align: center;"> Access Granted!</h3>
                
                <!-- Platform 1 -->
                <div class="platform-card">
                    <h2>ALL IN ONE</h2>
                    <p>All study platform in one place</p>
                    <button type="button" class="platform-btn" onclick="openSecurePlatform('https://code-x-studys.vercel.app/#providers')">Open Platform 1</button>
                </div>

                <!-- Platform 2 -->
                <div class="platform-card" style="margin-top: 15px;">
                    <h2>RAJNESH PRIME APP</h2>
                    <p>Exclusive Official Study Portal</p>
                    <button type="button" class="platform-btn" onclick="openSecurePlatform('https://rajnishkumars3721-cmyk.github.io/')">Open Platform 2</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Secure Sandbox Viewer Modal with allow-popups enabled -->
    <div id="secureViewer">
        <div class="viewer-header">
            <h2 id="viewerTitle">Secure Platform</h2>
            <button class="close-btn" onclick="closeSecurePlatform()">Close / Back</button>
        </div>
        <iframe id="platformFrame" class="secure-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYvsjbOgtXqdQx4bjiILDMa8d52MzaF1",
            authDomain: "rajnishprime-38165.firebaseapp.com",
            projectId: "rajnishprime-38165",
            storageBucket: "rajnishprime-38165.appspot.com",
            messagingSenderId: "411710609786",
            appId: "1:411710609786:web:9f483a511b5d121b25ec3",
            measurementId: "G-D501HHZJF0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openSecurePlatform = function(url) {
            const frame = document.getElementById('platformFrame');
            frame.src = url;
            document.getElementById('secureViewer').style.display = 'flex';
        }

        window.closeSecurePlatform = function() {
            const frame = document.getElementById('platformFrame');
            frame.src = "";
            document.getElementById('secureViewer').style.display = 'none';
        }

        const form = document.getElementById('paymentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                await addDoc(collection(db, "pendingUsers"), {
                    fullName: fullName,
                    mobileNumber: mobileNumber,
                    timestamp: new Date()
                });
                alert("Details submitted successfully! Verification pending.");
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error submitting details. Please check your internet connection.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Details";
            }
        });

        window.showStatusCheck = function() {
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('statusSection').style.display = 'block';
        }

        window.backToForm = function() {
            document.getElementById('statusSection').style.display = 'none';
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('contentArea').style.display = 'none';
        }

        window.checkApproval = async function() {
            const mobile = document.getElementById('verifyMobile').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');

            if(!mobile) {
                alert("Please enter your mobile number.");
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = "Checking...";

            try {
                const q = query(collection(db, "approvedUsers"), where("mobileNumber", "==", mobile));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    document.getElementById('verifyMobile').style.display = 'none';
                    verifyBtn.style.display = 'none';
                    document.getElementById('contentArea').style.display = 'block';
                } else {
                    alert(" Access Denied: Your payment is either pending verification or mobile number is not approved yet.");
                }
            } catch (error) {
                console.error("Error verifying user: ", error);
                alert("Error checking status. Try again.");
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerText = "Access Content";
            }
        };
    </script>
</body>
  </html>
