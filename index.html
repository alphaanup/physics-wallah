<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajnish Prime - Premium Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; }
        .price-box { font-size: 28px; font-weight: bold; color: #4ade80; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Membership Fee:</h1>
        <div class="price-box">₹199</div>
        <p>Scan & Pay ₹199 using any UPI App</p>
        
        <!-- QR Code Placeholder or Image -->
        <div style="background: #fff; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 20px;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=9661734021@ibl&pn=RajnishKumar&am=199&cu=INR" alt="UPI QR Code" style="width: 160px; height: 160px; display: block;">
        </div>

        <div style="background: #1f2937; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #9ca3af;">
            Access Code: <span style="color: #38bdf8; font-weight: bold;">Prime@2026</span><br>
            UPI ID: <span style="color: #4ade80; font-weight: bold;">9661734021@ibl</span>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="mobileNumber" placeholder="Enter your mobile number" required>
            </div>
            <button type="submit" id="submitBtn">Submit Details</button>
        </form>
    </div>
    
        <!-- Firebase App SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-js.js" type="module"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
                // Yahan apni asli Firebase configuration keys paste karein jo aapne Firebase Console se copy ki hain
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "rajnishprime-38165.firebaseapp.com",
            projectId: "rajnishprime-38165",
            storageBucket: "rajnishprime-38165.appspot.com",
            messagingSenderId: "411710609786",
            appId: "1:411710609786:web:9f483a511b5d121b25ec3",
            measurementId: "G-D501HHZJF0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('paymentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                await addDoc(collection(db, "pendingUsers"), {
                    fullName: fullName,
                    mobileNumber: mobileNumber,
                    timestamp: new Date()
                });
                alert("Details submitted successfully! Verification pending.");
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error submitting details. Please check your internet connection.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Details";
            }
        });
        
                // Social Media Link Interceptor Script
        const originalOpen = window.open;
        window.open = function(url) {
            if (!url) return originalOpen.apply(this, arguments);
            const lowerUrl = url.toLowerCase();
            if (
                lowerUrl.includes("whatsapp.com") ||
                lowerUrl.includes("wa.me") ||
                lowerUrl.includes("chat.whatsapp.com") ||
                lowerUrl.includes("whatsapp://") ||
                lowerUrl.includes("t.me") ||
                lowerUrl.includes("telegram.me")
            ){
                alert("❌ Access Denied: Social media redirection is blocked.");
                return null;
            }
            return originalOpen.apply(this, arguments);
        };
    </script>
</body>
</html>
